theme = "astrodark"

[keys.insert]
up = "no_op"
down = "no_op"
left = "no_op"
right = "no_op"

[keys.normal]
up = "no_op"
down = "no_op"
left = "no_op"
right = "no_op"
[editor]
gutters = ["diagnostics", "diff", "line-numbers", "spacer"]
line-number = "absolute"
cursorline = true
color-modes = true
auto-info = true

[editor.cursor-shape]
normal = "block"
insert = "bar"
select = "underline"

[keys.normal.space]
e = ":forest-open"
h = ":streal-open"
r = ":trail-open"
q = ":q"
w = ":w"
n = "goto_next_change"
N = "goto_prev_change"
m = ":showkeys-toggle"
[keys.normal.space.g]
g = ":sh foot --app-id lazygit -e lazygit >/dev/null 2>&1"
b = ":sh git blame -L %{cursor_line},%{cursor_line} %{buffer_name}"
d = ":sh git diff %{buffer_name}"
s = ":sh git status -s"
l = ":sh git log --oneline -20"
[keys.normal.space.t]
t = ":sh kitty >/dev/null 2>&1"
k = ":sh pkill kitty >/dev/null 2>&1"
